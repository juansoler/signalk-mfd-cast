<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>MFD Cast</title>
    <link rel="icon" href="./icon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <img src="./icon.svg" alt="" width="26" height="26" />
          <span>MFD Cast</span>
        </div>

        <div class="statusline">
          <span id="dot" class="dot"></span>
          <span id="state-label">Iniciando…</span>
          <span id="telemetry" class="muted"></span>
        </div>

        <div class="actions">
          <button id="settings-button" class="ghost" title="Conexión">⚙</button>
          <button id="fullscreen" class="ghost" title="Pantalla completa">⛶</button>
          <button id="control" class="primary" disabled>Tomar control</button>
        </div>
      </header>

      <main id="stage">
        <div id="frame">
          <video id="video" muted playsinline autoplay></video>
          <div id="touch" class="touch-layer" aria-hidden="true"></div>
          <div id="lock" class="overlay lock hidden">Pantalla bloqueada en el MFD</div>

          <div id="message" class="overlay message">
            <h1 id="message-title">Conectando…</h1>
            <p id="message-text"></p>
            <div id="message-actions" class="message-actions"></div>
          </div>

          <div id="banner" class="banner hidden"></div>
          <div id="toast" class="toast hidden"></div>
        </div>
      </main>

      <footer>
        <div id="keys" class="keys"></div>
        <div class="footer-meta">
          <span id="mode" class="muted"></span>
          <a id="vlc" class="link" href="./../plugins/signalk-mfd-cast/playlist.m3u" download="mfd.m3u">
            Abrir en VLC
          </a>
        </div>
      </footer>
    </div>

    <dialog id="settings">
      <form id="settings-form">
        <h2>Conexión con el MFD</h2>
        <p class="hint">
          Dirección del plotter en la red del barco. El puerto RTSP y el resto de
          opciones se ajustan en la configuración del plugin.
        </p>
        <label>
          IP del MFD
          <input id="address-input" name="address" inputmode="decimal" placeholder="192.168.0.10" required />
        </label>
        <p id="settings-error" class="error hidden"></p>
        <div class="dialog-actions">
          <button type="button" id="settings-cancel" class="ghost">Cancelar</button>
          <button type="submit" id="settings-save" class="primary">Conectar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./player.js"></script>
  </body>
</html>
